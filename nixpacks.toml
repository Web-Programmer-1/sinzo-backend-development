# nixpacks.toml

providers = ["node"]

[variables]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
aptPkgs = [
  "...",
  "curl",
  "wget",
  "ca-certificates",
  "chromium"
]

[phases.install]
cmds = [
  "curl -fsSL https://deb.nodesource.com/setup_22.x | bash -",
  "apt-get install -y nodejs",
  "node -v",
  "npm -v",
  "npm install"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "npm start"